<svg class="trial-spike-band d-block w-100" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 490" role="img" aria-labelledby="trace-title trace-desc"><title id="trace-title">Ten channels of filtered Neuropixels voltage</title><desc id="trace-desc">Ten example electrode channels, band-pass filtered from 300 to 6000 Hz. The vertical line at zero marks the current video frame.</desc>
  <style>
    .trial-spike-band text { fill: #edf2f5; font: 15px system-ui, sans-serif; }
    .trial-spike-band :is(.axis, .reference, .baseline) { fill: none; stroke: #edf2f5; stroke-width: 1; }
    .trial-spike-band .reference { stroke-dasharray: 4 4; opacity: .48; }
    .trial-spike-band .baseline { opacity: .2; }
    .trial-spike-band .signal { fill: none; stroke: #79dce8; stroke-width: .95; stroke-linejoin: round; }
    .trial-spike-band .signal.is-muted { opacity: .2; }
  </style>
